{% extends 'library/base.html' %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <div class="video-container">
                        <img id="video" style="width: 100%; max-width: 1920px; height: auto;">
                        <canvas id="canvas" style="display:none;"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <button id="startButton" class="btn btn-primary">Start Camera</button>
                    <button id="captureButton" class="btn btn-success" disabled>Capture</button>
                    <div id="status" class="mt-3"></div>
                    <div id="result" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.video-container {
    position: relative;
    width: 100%;
    background: #000;
    overflow: hidden;
}

#video {
    display: block;
    object-fit: contain;
    background: #000;
}
</style>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startButton = document.getElementById('startButton');
    const captureButton = document.getElementById('captureButton');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');

    let streamInterval = null;
    const scannerType = '{{ scanner_type }}';

    function startStream() {
        // Set the video source to the streaming endpoint
        video.src = "{% url 'video_feed' 'id_card' %}";
        statusDiv.textContent = 'Camera started';
        startButton.disabled = true;
        captureButton.disabled = false;
    }

    async function captureFrame() {
        try {
            const response = await fetch(`/capture-frame/${scannerType}/`);
            const data = await response.json();
            
            if (data.status === 'success') {
                if (data.text) {
                    resultDiv.textContent = 'Extracted text: ' + data.text;
                } else {
                    resultDiv.textContent = 'Frame captured successfully';
                }
            } else {
                statusDiv.textContent = 'Error: ' + data.error;
            }
        } catch (error) {
            statusDiv.textContent = 'Error capturing frame: ' + error.message;
        }
    }

    startButton.addEventListener('click', startStream);

    captureButton.addEventListener('click', captureFrame);

    // Clean up on page unload
    window.addEventListener('beforeunload', function() {
        if (streamInterval) {
            clearInterval(streamInterval);
        }
        // Stop the scanner
        fetch('/stop-scanner/', {
            method: 'POST'
        });
    });
</script>
{% endblock %}
